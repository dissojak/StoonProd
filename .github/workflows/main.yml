name: Next.js FTP Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Functional tests
        run: npm run test:functional

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Create deployment bundle
        run: |
          mkdir -p deploy
          cp package.json package-lock.json next.config.mjs deploy/
          cp -R .next deploy/.next
          cp -R public deploy/public
          # Install only production deps inside the deploy folder
          npm ci --omit=dev --ignore-scripts --prefix deploy

      - name: Generate .env.local
        run: |
          cat <<'EOF' > deploy/.env.local
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_STRAPI_URL=${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          EOF